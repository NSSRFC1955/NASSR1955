<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بث ناديي</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: url('https://i.imgur.com/rCXKYIE.png') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: 'Roboto', sans-serif;
      flex-direction: column;
    }

    /* تأثير الإضاءة عند تحريك الماوس */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.2), transparent 30%);
      pointer-events: none;
      transition: background 0.2s ease;
      z-index: 1;
    }

    /* الزر الحديث */
    .btn {
      background: linear-gradient(45deg, #000033, #000050);
      color: #FFFF00;
      padding: 20px 40px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font: 700 28px 'Roboto', sans-serif;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 
        0 5px 15px rgba(0, 0, 0, 0.6),
        inset 0 2px 5px rgba(255, 255, 255, 0.1),
        inset 0 -2px 5px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      animation: policeLights 1.2s infinite;
      z-index: 3;
      text-decoration: none;
      position: relative;
    }

    .btn:hover {
      background: linear-gradient(45deg, #000050, #000066);
      box-shadow: 
        0 8px 25px rgba(0, 0, 102, 0.7),
        inset 0 3px 7px rgba(255, 255, 255, 0.2),
        inset 0 -3px 7px rgba(0, 0, 0, 0.4);
      transform: translateY(-2px);
    }

    .btn img {
      width: 40px;
      height: 40px;
    }

    .btn span {
      color: #FFFF00;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255, 255, 0, 0.5);
    }

    /* تأثيرات الشرطة */
    @keyframes policeLights {
      0%, 100% { box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -2px 5px rgba(0,0,0,0.3), 0 0 20px #FFFF00, 0 0 30px #FFFF00; }
      50% { box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -2px 5px rgba(0,0,0,0.3), 0 0 20px #FFD700, 0 0 30px #FFD700; }
    }

    /* تأثير النار عند النقر */
    @keyframes fireEffect {
      0% { transform: scale(1); opacity: 1; }
      20% { transform: scale(1.1); opacity: 0.9; box-shadow: 0 0 20px #FF4500, 0 0 30px #FFA500; background: linear-gradient(45deg, #FF4500, #FF8C00); }
      40% { transform: scale(1.2); opacity: 0.7; box-shadow: 0 0 30px #FF8C00, 0 0 40px #FF4500; }
      60% { transform: scale(1.1); opacity: 0.5; box-shadow: 0 0 40px #FF6347, 0 0 50px #DC143C; }
      80% { transform: scale(0.9); opacity: 0.3; box-shadow: 0 0 50px #DC143C, 0 0 60px #8B0000; }
      100% { transform: scale(0.5); opacity: 0; box-shadow: 0 0 0 transparent; background: transparent; }
    }

    .btn.fire {
      animation: fireEffect 1.2s forwards;
    }

    /* مشغل البث */
    #player {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 9999;
      background: #000;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body onmousemove="moveLight(event)">

  <!-- الزر -->
  <a href="#" class="btn" onclick="fireButton(event)">
    <img src="https://i.imgur.com/bZmRIiB.png" alt="Icon">
    <span>CLICK HERE</span>
  </a>

  <!-- مشغل البث -->
  <div id="player">
    <iframe
      src="https://player.twitch.tv/?channel=live123one&parent=nssrfc1955.github.io&autoplay=true&muted=false"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    function moveLight(e) {
      document.body.style.setProperty('--x', `${e.clientX}px`);
      document.body.style.setProperty('--y', `${e.clientY}px`);
    }

    function fireButton(e) {
      e.preventDefault();
      const btn = e.target.closest('.btn');
      btn.classList.add('fire');

      setTimeout(() => {
        btn.classList.remove('fire');
        const player = document.getElementById('player');
        player.style.display = 'block';

        // طلب الشاشة الكاملة
        if (player.requestFullscreen) player.requestFullscreen();
        else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
        else if (player.msRequestFullscreen) player.msRequestFullscreen();
      }, 1200);
    }

    // الخروج بـ Esc
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const player = document.getElementById('player');
        if (player.style.display === 'block') {
          player.style.display = 'none';
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }
    });

    // دعم الجوال: تشغيل الإضاءة عند اللمس
    document.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      document.body.style.setProperty('--x', `${touch.clientX}px`);
      document.body.style.setProperty('--y', `${touch.clientY}px`);
    });
  </script>
</body>
</html>
