<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النصر — البث الرسمي المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #04060d;
            --void-2: #0a1024;
            --gold: #f4c430;
            --gold-soft: #ffe27a;
            --ivory: #f5f2e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; width: 100%;
            background: var(--void);
            color: var(--ivory);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #bgVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.65) contrast(1.1);
        }
        #layerBlur {
            position: fixed;
            inset: -5%;
            z-index: -1;
            background: rgba(4, 6, 13, 0.6);
        }
        #player-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; max-width: 1280px;
            height: 72vh;
            background: rgba(0,0,0,0.9);
            border: 4px solid var(--gold);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(244, 196, 48, 0.6);
            z-index: 10;
        }
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }
        .header {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(4,6,13,0.95);
            padding: 12px 40px;
            border-radius: 50px;
            border: 3px solid var(--gold);
            z-index: 30;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
            box-shadow: 0 0 30px rgba(244, 196, 48, 0.5);
        }
        .overlay {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 10px 25px;
            border-radius: 30px;
            z-index: 20;
            font-size: 1.2rem;
            border: 2px solid var(--gold-soft);
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- خلفية فيديو (غير مفعلة حالياً - أزل التعليق إذا أردت) -->
        <!-- 
        <video id="bgVideo" autoplay loop muted playsinline>
            <source src="رابط_فيديو_الخلفية.mp4" type="video/mp4">
        </video>
        -->
        <div id="layerBlur"></div>

        <div class="header">النصر — البث الرسمي المباشر</div>

        <div id="player-container">
            <!-- ضع هنا رابط البث الخاص بك -->
            <iframe 
                src="رابط_البث_هنا" 
                allowfullscreen 
                allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        </div>

        <div class="overlay">🔴 مباشر • النصر</div>
    </div>

    <script>
        console.log("%cصفحة النصر جاهزة للبث ✅", "color: #f4c430; font-size: 16px;");
    </script>
</body>
</html>
