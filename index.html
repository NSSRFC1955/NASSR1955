<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النصر — البث الرسمي المباشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060d;
    --void-2:#0a1024;
    --gold:#f4c430;
    --gold-soft:#ffe27a;
    --amber:#ffb100;
    --navy:#0b1a4d;
    --ivory:#f5f2e9;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Tajawal', sans-serif;
    color:var(--ivory);
  }

  /* خلفية الفيديو */
  #bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.65) contrast(1.1);
  }

  #layerBlur { z-index: -1; }
</style>
</head>
<body>

  <!-- خلفية الفيديو من Cloudflare -->
  <video id="bgVideo" autoplay loop muted playsinline>

  </video>
