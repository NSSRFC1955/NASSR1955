<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النصر — البث الرسمي المباشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@300;400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04060d;
    --void-2:#0a1024;
    --gold:#f4c430;
    --gold-soft:#ffe27a;
    --amber:#ffb100;
    --navy:#0b1a4d;
    --ivory:#f5f2e9;
    --ivory-dim:rgba(245,242,233,0.55);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Tajawal', sans-serif;
    color:var(--ivory);
  }

  /* ============ خلفية الفيديو ============ */
  #bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.65) contrast(1.1) saturate(1.1);
  }

  /* ============ Layer 0 — blurred cover fill ============ */
  #layerBlur{
    position:fixed; inset:-5%; z-index:-1;
    background-image:url("data:image/jpeg;base64,..."); /* قصرتها للتوفير */
  }

  .glint, #stage, #playerWrap, .content {
    z-index: 1;
  }

  /* باقي الـ CSS الأصلي (لم أغيره) */
  /* ... (كل الـ style الأصلي يبقى كما هو) ... */

</style>
</head>
<body>

  <!-- خلفية الفيديو -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="NASSR.mp4" type="video/mp4">
  </video>

  <!-- باقي محتوى الصفحة الأصلي -->
  <div id="layerBlur">
    <div class="glint"></div>
  </div>

  <div id="stage">
    <!-- كل المحتوى الأصلي (الـ crest + particles + buttons) يبقى كما هو -->
    <div class="content">
      <!-- ... باقي الكود الأصلي ... -->
    </div>

    <button id="ctaBtn">
      <span class="cta-text">CLICK HERE</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <button id="closeBtn" aria-label="إغلاق البث">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <div id="playerWrap">
    <iframe id="playerFrame" src="" data-src="https://customer-tuzc75ya0fkdp6sw.cloudflarestream.com/04708f889a06a2d319b577eda874a075/iframe?autoplay=true" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
  </div>

<script>
  // باقي الـ JavaScript الأصلي كامل (لم يتغير)
  const crestWrap  = document.getElementById('crestWrap');
  const crestOuter = document.getElementById('crestOuter');
  const stage      = document.getElementById('stage');
  const layerBack  = document.getElementById('layerBack');
  const particleC  = document.getElementById('particleField');
  const playerWrap = document.getElementById('playerWrap');
  const playerFrame= document.getElementById('playerFrame');
  const closeBtn   = document.getElementById('closeBtn');
  const ctaBtn     = document.getElementById('ctaBtn');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function handlePointer(clientX, clientY){
    const wx = window.innerWidth, wy = window.innerHeight;
    const nx = (clientX / wx) - 0.5;
    const ny = (clientY / wy) - 0.5;

    if(!reduceMotion){
      layerBack.style.transform  = `translate(${nx * -18}px, ${ny * -14}px) scale(1.04)`;
      stage.style.transform      = `translate(${nx * 10}px, ${ny * 8}px)`;
      particleC.style.transform  = `translate(${nx * -8}px, ${ny * -6}px)`;
    }

    const rect = crestWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (clientX - cx) / rect.width;
    const dy = (clientY - cy) / rect.height;
    const maxTilt = 24;
    crestWrap.style.transform = `rotateY(${dx * maxTilt}deg) rotateX(${-dy * maxTilt}deg)`;
  }

  document.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));
  document.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if(t) handlePointer(t.clientX, t.clientY);
  }, {passive:true});

  const ctx = particleC.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = particleC.width  = window.innerWidth;
    H = particleC.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(){
    return { x: Math.random() * W, y: H + Math.random() * 100, r: Math.random() * 1.6 + 0.6, speed: Math.random() * 0.5 + 0.25, drift: (Math.random() - 0.5) * 0.4, alpha: Math.random() * 0.5 + 0.2, twinkle: Math.random() * Math.PI * 2 };
  }
  const PARTICLE_COUNT = reduceMotion ? 0 : 46;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const p = makeParticle();
    p.y = Math.random() * H;
    particles.push(p);
  }

  function tick(){
    if(!reduceMotion){
      ctx.clearRect(0,0,W,H);
      for(const p of particles){
        p.y -= p.speed;
        p.x += p.drift;
        p.twinkle += 0.03;
        if(p.y < -10){ Object.assign(p, makeParticle()); p.y = H + 10; }
        const a = p.alpha * (0.6 + 0.4 * Math.sin(p.twinkle));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(244,196,48,${a})`;
        ctx.shadowColor = 'rgba(244,196,48,0.8)';
        ctx.shadowBlur = 6;
        ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function openStream(){
    playerFrame.src = playerFrame.dataset.src;
    playerWrap.classList.add('active');
    stage.style.pointerEvents = 'none';
    setTimeout(() => closeBtn.classList.add('show'), 500);
  }
  function closeStream(){
    playerWrap.classList.remove('active');
    closeBtn.classList.remove('show');
    stage.style.pointerEvents = 'auto';
    setTimeout(() => { playerFrame.src = ''; }, 700);
  }

  crestWrap.addEventListener('click', openStream);
  ctaBtn.addEventListener('click', openStream);
  closeBtn.addEventListener('click', closeStream);
</script>

</body>
</html>
