<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث ناديي</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #000;
            font-family: 'Roboto', sans-serif;
        }
        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }
        .btn {
            background: linear-gradient(45deg, #000033, #000050);
            color: #FFFF00;
            padding: 20px 40px;
            border-radius: 10px;
            font: 700 28px 'Roboto', sans-serif;
            cursor: pointer;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: policeLights 1.5s infinite;
            z-index: 5;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.08);
        }
        .btn img {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;          /* يحافظ على طابع البكسل */
            animation: run-shake 1.8s infinite steps(6);
        }
        @keyframes policeLights {
            0%,100% { box-shadow: 0 0 25px #ffff00; }
            50%     { box-shadow: 0 0 25px #ffd700; }
        }
        @keyframes run-shake {
            0%,100%   { transform: translateX(0) rotate(0deg); }
            25%       { transform: translateX(6px) rotate(3deg); }
            50%       { transform: translateX(0) rotate(0deg); }
            75%       { transform: translateX(-6px) rotate(-3deg); }
        }
        .btn.fire {
            animation: fireEffect 1.2s forwards;
        }
        @keyframes fireEffect {
            to {
                transform: scale(0);
                opacity: 0;
            }
        }
        #player {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
        }
        #player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<video class="video-background" autoplay muted loop playsinline>
    <source src="https://i.imgur.com/IIC7LaR.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<a href="#" class="btn" onclick="startLive(event)">
    <img src="https://i.imgur.com/IljxJzJ.jpeg" alt="نادي">
    <span>اضغط هنا للبث</span>
</a>

<div id="player">
    <iframe
        src="https://customer-tuzc75ya0fkdp6sw.cloudflarestream.com/9eb5063e3634f82962ea487f07521ff8/iframe?autoplay=true"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<script>
function startLive(e) {
    e.preventDefault();
    const btn = document.querySelector('.btn');
    btn.classList.add('fire');
    setTimeout(() => {
        btn.style.display = 'none';
        document.getElementById('player').style.display = 'block';
    }, 1200);
}

// إغلاق البث بزر ESC
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        document.getElementById('player').style.display = 'none';
        document.querySelector('.btn').style.display = 'flex';
    }
});
</script>
</body>
</html>
