<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النصر — البث الرسمي المباشر</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #000;
  }

  #bgVideo {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.6) contrast(1.1);
  }

  .overlay {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
  }
</style>
</head>
<body>

  <!-- خلفية الفيديو -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="https://raw.githubusercontent.com/nssrfc1955/NASSR1955/main/NASSR.mp4" type="video/mp4">
  </video>

  <!-- محتوى الصفحة -->
  <div class="overlay">
    <div>
      <h1 style="font-size:2.5rem; margin-bottom:20px;">النصر — البث الرسمي</h1>
      <button onclick="document.getElementById('player').style.display='block'" 
              style="padding:15px 30px; font-size:1.2rem; background:#f4c430; color:black; border:none; border-radius:8px; cursor:pointer;">
        شغل البث
      </button>
    </div>
  </div>

  <!-- مشغل البث -->
  <iframe id="player" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:10;" 
    src="https://customer-tuzc75ya0fkdp6sw.cloudflarestream.com/04708f889a06a2d319b577eda874a075/iframe?autoplay=true" 
    allowfullscreen></iframe>

</body>
</html>
