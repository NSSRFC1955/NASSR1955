<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النصر — البث الرسمي المباشر</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #04060d;
  }

  /* خلفية الفيديو */
  #bgVideo {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.55) contrast(1.1);
  }

  /* محتوى فوق الفيديو */
  .overlay {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
  }
</style>
</head>
<body>

  <!-- خلفية الفيديو -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="NASSR.mp4" type="video/mp4">
    <source src="./NASSR.mp4" type="video/mp4">
  </video>

  <!-- محتوى الصفحة (ضع هنا كل محتواك الأصلي) -->
  <div class="overlay">
    <div>
      <h1>النصر — البث الرسمي</h1>
      <p>جاري رفع الخلفية...</p>
      <button onclick="document.getElementById('playerFrame').src = 'https://customer-tuzc75ya0fkdp6sw.cloudflarestream.com/04708f889a06a2d319b577eda874a075/iframe?autoplay=true'">
        شغل البث
      </button>
    </div>
  </div>

  <!-- لو عندك الـ iframe للبث -->
  <iframe id="playerFrame" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:10; display:none;" allowfullscreen></iframe>

<script>
  // للتصحيح
  const video = document.getElementById('bgVideo');
  video.addEventListener('loadeddata', () => console.log('✅ الفيديو تم تحميله بنجاح'));
  video.addEventListener('error', (e) => console.error('❌ خطأ في الفيديو:', e));

  console.log('مسار الفيديو المستخدم:', video.currentSrc);
</script>

</body>
</html>
