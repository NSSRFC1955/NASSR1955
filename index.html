<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النصر — البث الرسمي المباشر</title>
    <style>
        body,html{margin:0;padding:0;height:100%;background:#04060d;color:#fff;font-family:sans-serif;overflow:hidden}
        #crest{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;height:380px;cursor:pointer}
        #crest img{width:100%;filter:drop-shadow(0 0 60px #f4c430)}
        #player{position:fixed;inset:0;background:#000;display:none;z-index:100}
        #player.active{display:block}
        iframe{width:100%;height:100%;border:none}
        button{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#f4c430;color:#000;padding:18px 50px;border:none;border-radius:50px;font-size:1.4rem;font-weight:bold;cursor:pointer;z-index:10}
        #close{position:fixed;top:30px;right:30px;background:rgba(0,0,0,0.8);color:#fff;border:none;width:50px;height:50px;border-radius:50%;font-size:28px;cursor:pointer;display:none;z-index:200}
        #close.show{display:block}
    </style>
</head>
<body>
    <div id="crest"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Al_Nassr_FC_(logo).svg/1024px-Al_Nassr_FC_(logo).svg.png" alt="النصر"></div>
    <button onclick="openStream()">شاهد البث المباشر ⚽</button>
    
    <div id="player">
        <iframe src="https://customer-tuzc75ya0fkdp6sw.cloudflarestream.com/04708f889a06a2d319b577eda874a075/iframe?autoplay=true" allowfullscreen></iframe>
    </div>
    
    <button id="close" onclick="closeStream()">✕</button>

    <script>
        function openStream(){ 
            document.getElementById('player').classList.add('active'); 
            document.getElementById('close').classList.add('show'); 
        }
        function closeStream(){ 
            document.getElementById('player').classList.remove('active'); 
            document.getElementById('close').classList.remove('show'); 
        }
    </script>
</body>
</html>
